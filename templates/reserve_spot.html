{% extends 'base.html' %}
{% block title %}Reserve Spot{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="page-header"><i class="fas fa-calendar-check"></i> Reserve a Spot</h1>
    <div class="form-card">
        <form method="POST" action="{{ url_for('reserve_spot_page') }}">
            <div class="mb-3">
                <label for="course_id" class="form-label">Select Course</label>
                <select id="course_id" name="course_id" class="form-select" required>
                    <option value="">-- Choose a course --</option>
                    {% for course in courses %}
                    <option value="{{ course.id }}">
                        {{ course.title }} — {{ course.location }} ({{ course.start_date }} to {{ course.end_date }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-check"></i> Reserve Spot
            </button>
        </form>
    </div>
</div>
{% endblock %}
