{% extends 'base.html' %}
{% block title %}{{ _('Profile') }}{% endblock %}
{% block page_title %}{{ _('Edit Profile') }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row g-4">

        <!-- Basic info -->
        <div class="col-md-6">
            <div class="form-card h-100">
                <h6 class="mb-4" style="color:var(--accent);font-weight:600;letter-spacing:.03em">
                    <i class="fas fa-user me-2"></i>{{ _('Edit Profile') }}
                </h6>
                <form method="POST">
                    <input type="hidden" name="action" value="update_info">
                    <div class="mb-3">
                        <label class="form-label">{{ _('Full Name') }}</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ current_user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('Email') }}</label>
                        <input type="email" class="form-control"
                               value="{{ current_user.email }}" disabled>
                        <div class="form-text text-muted">Sähköpostia ei voi vaihtaa tätä kautta.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('Phone') }}</label>
                        <input type="tel" name="phone" class="form-control"
                               value="{{ user_data[5] or '' if user_data else '' }}">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">{{ _('Role') }}</label>
                        <input type="text" class="form-control" disabled
                               value="{% if current_user.is_admin %}{{ _('Admin') }}{% elif current_user.is_teacher %}{{ _('Teacher') }}{% else %}{{ _('Student') }}{% endif %}">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>{{ _('Save Changes') }}
                    </button>
                </form>
            </div>
        </div>

        <!-- Change password -->
        <div class="col-md-6">
            <div class="form-card h-100">
                <h6 class="mb-4" style="color:var(--accent);font-weight:600;letter-spacing:.03em">
                    <i class="fas fa-lock me-2"></i>{{ _('Change Password') }}
                </h6>
                <form method="POST">
                    <input type="hidden" name="action" value="change_password">
                    <div class="mb-3">
                        <label class="form-label">{{ _('Current Password') }}</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('New Password') }}</label>
                        <input type="password" name="new_password" class="form-control"
                               minlength="6" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">{{ _('Confirm New Password') }}</label>
                        <input type="password" name="confirm_password" class="form-control"
                               minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-key me-1"></i>{{ _('Change Password') }}
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
