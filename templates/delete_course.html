{% extends 'base.html' %}
{% block title %}Delete Course{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="page-header"><i class="fas fa-trash-alt"></i> Delete Course</h1>

    <div class="form-card">
        {% if courses %}
        <p class="text-muted mb-3">Select a course to permanently delete it and all its sessions and enrollments.</p>
        <form method="POST" action="{{ url_for('delete_course_page') }}"
              onsubmit="return confirm('Are you sure you want to delete this course? This cannot be undone.')">
            <div class="mb-3">
                <label for="course_id" class="form-label">Select Course</label>
                <select id="course_id" name="course_id" class="form-select" required>
                    <option value="">-- Choose a course --</option>
                    {% for course in courses %}
                    <option value="{{ course.id }}">{{ course.title }} ({{ course.start_date }} – {{ course.end_date }})</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-danger">
                <i class="fas fa-trash-alt"></i> Delete Course
            </button>
            <a href="{{ url_for('courses') }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
        {% else %}
        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i> No courses available to delete.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
