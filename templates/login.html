<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Opinahjo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div style="position:fixed;top:1rem;right:1rem;z-index:9999;width:300px;">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login_page') }}">
        <h3><i class="fas fa-graduation-cap"></i> Opinahjo</h3>
        <p class="subtitle">Course Management System</p>

        <label for="username">Username</label>
        <div class="input-group mb-3">
            <span class="addon"><i class="fa fa-user"></i></span>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>

        <label for="password">Password</label>
        <div class="input-group mb-3">
            <span class="addon"><i class="fa fa-lock"></i></span>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit">
            Log In <i class="fas fa-sign-in-alt"></i>
        </button>
    </form>

    <footer>
        <p>&copy; 2024 Opinahjo</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
